<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RVA - Loading</title>
    <!-- Google Fonts for a modern typography -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-color: #0b1120; /* Deep sleek dark background */
            --text-color: #f8fafc;
            --accent-color: #38bdf8;
        }
        
        * {
            box-sizing: border-box;
        }

        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            background-color: var(--bg-color);
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: 'Inter', sans-serif;
            overflow: hidden;
        }

        /* The container fades in, stays, then fades out right before redirecting */
        .loader-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 2.5rem;
            animation: fadeInOut 2.8s ease-in-out forwards;
        }

        /* Pulsing logo effect */
        .logo {
            width: 160px;
            max-width: 80vw;
            height: auto;
            animation: pulse 2s infinite ease-in-out;
            filter: drop-shadow(0 0 15px rgba(255, 255, 255, 0.05));
        }

        /* Modern text styling */
        .loading-text {
            color: var(--text-color);
            font-size: 1.1rem;
            letter-spacing: 0.3em;
            text-transform: uppercase;
            font-weight: 500;
            position: relative;
            padding-bottom: 8px;
            overflow: hidden;
            opacity: 0.9;
        }

        /* A glowing sliding bar underneath the text */
        .loading-text::after {
            content: '';
            position: absolute;
            bottom: 0;
            left: -100%;
            width: 100%;
            height: 2px;
            background: linear-gradient(90deg, transparent, var(--accent-color), transparent);
            animation: slide 1.5s infinite ease-in-out;
        }
        
        @keyframes pulse {
            0% { transform: scale(0.95); opacity: 0.8; }
            50% { transform: scale(1.05); opacity: 1; filter: drop-shadow(0 0 35px rgba(56, 189, 248, 0.3)); }
            100% { transform: scale(0.95); opacity: 0.8; }
        }

        @keyframes fadeInOut {
            0% { opacity: 0; transform: translateY(15px); filter: blur(4px); }
            15% { opacity: 1; transform: translateY(0); filter: blur(0); }
            85% { opacity: 1; transform: translateY(0); filter: blur(0); }
            100% { opacity: 0; transform: translateY(-15px); filter: blur(4px); }
        }

        @keyframes slide {
            0% { left: -100%; }
            100% { left: 100%; }
        }
    </style>
</head>
<body>
    <div class="loader-container">
        <!-- Using the user's logo -->
        <img src="assets/logo/logo_png.png" alt="RVA Logo" class="logo">
        <div class="loading-text">Loading</div>
    </div>

    <script>
        // Redirect automatically to the home directory after 2.8 seconds
        setTimeout(() => {
            window.location.href = 'home/';
        }, 2800);
    </script>
</body>
</html>
